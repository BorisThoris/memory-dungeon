<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1080" width="740" height="1080">
  <title>Memory Dungeon card face panel — stone, gold frame, calm center, live rune ring (PLAY-008)</title>
  <desc>Layered for the board: each `front-*` group is traced into its own mesh by
  `cardSvgPlaneGeometry` and animated by `AnimatedCardFrontSvgLayers`, so the frame catches light,
  the well breathes and the rune ring turns while the illustration raster shows through the
  transparent centre. Keep the group ids and their order; the panel is the only opaque layer.</desc>
  <defs>
    <linearGradient id="stonePanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="50%" stop-color="#0c1018"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <radialGradient id="centerWell" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#0a1624" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#060810" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#040508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2d39d"/>
      <stop offset="50%" stop-color="#a67832"/>
      <stop offset="100%" stop-color="#4a3218"/>
    </linearGradient>
    <linearGradient id="runeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="55%" stop-color="#c3954f"/>
      <stop offset="100%" stop-color="#7a5228"/>
    </linearGradient>
  </defs>

  <g id="front-panel">
    <rect x="0" y="0" width="740" height="1080" rx="48" ry="48" fill="url(#stonePanel)"/>
  </g>

  <g id="front-well">
    <!-- Calm center for the illustration; breathes so the art never sits on dead stone. -->
    <ellipse cx="370" cy="520" rx="200" ry="240" fill="url(#centerWell)"/>
  </g>

  <g id="front-frame">
    <rect x="24" y="28" width="692" height="1024" rx="36" ry="36" fill="none" stroke="url(#frameGold)" stroke-width="4"/>
  </g>

  <g id="front-fine">
    <rect x="40" y="44" width="660" height="992" rx="28" ry="28" fill="none" stroke="#c3954f" stroke-width="1.2" opacity="0.45"/>
  </g>

  <g id="front-rune-ring">
    <!-- Twelve marks on a circle round the well: the layer turns, so they read as a slow orbit. -->
    <circle cx="370" cy="520" r="258" fill="none" stroke="url(#runeGold)" stroke-width="1.1" opacity="0.5"/>
    <g fill="url(#runeGold)">
      <rect x="366" y="248" width="8" height="26" rx="2"/>
      <rect x="366" y="766" width="8" height="26" rx="2"/>
      <rect x="236" y="516" width="26" height="8" rx="2" transform="rotate(90 249 520)"/>
      <rect x="478" y="516" width="26" height="8" rx="2" transform="rotate(90 491 520)"/>
      <rect x="360" y="270" width="6" height="18" rx="2" transform="rotate(30 370 520)"/>
      <rect x="360" y="270" width="6" height="18" rx="2" transform="rotate(60 370 520)"/>
      <rect x="360" y="270" width="6" height="18" rx="2" transform="rotate(120 370 520)"/>
      <rect x="360" y="270" width="6" height="18" rx="2" transform="rotate(150 370 520)"/>
      <rect x="360" y="270" width="6" height="18" rx="2" transform="rotate(210 370 520)"/>
      <rect x="360" y="270" width="6" height="18" rx="2" transform="rotate(240 370 520)"/>
      <rect x="360" y="270" width="6" height="18" rx="2" transform="rotate(300 370 520)"/>
      <rect x="360" y="270" width="6" height="18" rx="2" transform="rotate(330 370 520)"/>
    </g>
  </g>

  <g id="front-corners">
    <!-- A gold tick inside each corner of the frame; they catch the light one after another. -->
    <path d="M52 96 V64 H84" fill="none" stroke="url(#runeGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M688 96 V64 H656" fill="none" stroke="url(#runeGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M52 984 V1016 H84" fill="none" stroke="url(#runeGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M688 984 V1016 H656" fill="none" stroke="url(#runeGold)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
